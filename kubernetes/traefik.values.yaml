image:
  tag: v3.7.12
fullnameOverride: traefik
service:
  enabled: false
gateway:
  enabled: false
gatewayClass:
  enabled: false
ingressClass:
  enabled: false
api:
  dashboard: false
providers:
  kubernetesCRD:
    enabled: false
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: true
    namespaces:
    - systems
    statusAddress:
      service:
        enabled: true
        name: systems-gateway
        namespace: systems
ports:
  traefik:
    port: 9000
  web:
    port: 80
  websecure:
    port: 443
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
persistence:
  enabled: false
deployment:
  podLabels:
    systems.freddie.xyz/gateway: 'true'
log:
  format: json
securityContext:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE

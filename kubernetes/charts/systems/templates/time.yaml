{{- if and .Values.dailyReport.enabled .Values.dailyReport.web.enabled }}
{{- $report := .Values.dailyReport }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: time
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: time
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: time}
  ports:
    - {name: http, port: 8000, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: time
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: time}
  template:
    metadata:
      labels: {app.kubernetes.io/name: time}
    spec:
      # Prefer an active writer's node during a rollout to avoid RWO reattachment.
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: {app.kubernetes.io/name: daily-report}
                topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: false
      serviceAccountName: time
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: cache-existing
          image: {{ $report.image | quote }}
          command: [python, -m, report_cache]
          env:
            - {name: DATA_DIR, value: /data}
            - {name: TZ, value: {{ $report.timeZone | quote }}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml $report.web.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
      containers:
        - name: time
          image: {{ $report.image | quote }}
          command: [python, -m, uvicorn]
          args: ["web:app", --host, "0.0.0.0", --port, "8000", --proxy-headers, --forwarded-allow-ips, "127.0.0.1,10.72.0.0/16"]
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: DATA_DIR, value: /data}
            - {name: TZ, value: {{ $report.timeZone | quote }}}
            - {name: TIME_HTTPS_ORIGIN, value: {{ printf "https://%s" $report.web.hostname | quote }}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            exec:
              command: [python, /etc/probes/check.py, {{ $report.web.hostname | quote }}, /ready]
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: [python, /etc/probes/check.py, {{ $report.web.hostname | quote }}, /ready]
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [python, /etc/probes/check.py, {{ $report.web.hostname | quote }}, /health]
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            {{- toYaml $report.web.resources | nindent 12 }}
          volumeMounts:
            # Only PDFs are visible to the web process, never OAuth/print state.
            - {name: data, mountPath: /data/reports, subPath: reports, readOnly: true}
            - {name: probes, mountPath: /etc/probes, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: daily-report-data}
        - name: probes
          configMap: {name: systems-probes}
        - name: tmp
          emptyDir: {}
{{- end }}

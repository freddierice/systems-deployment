apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # Retain the existing claim and its old contents for rollback. Traefik uses
  # its own /data/traefik-acme.json file on the same persistent volume.
  name: systems-caddy-data
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.gateway.storageClass }}
  resources:
    requests:
      storage: {{ .Values.gateway.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: systems-gateway
spec:
  replicas: 1
  # A single Traefik owns certificate state on a ReadWriteOnce volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: systems-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: systems-gateway
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      dnsPolicy: None
      dnsConfig:
        nameservers: [{{ .Values.dns.serviceIP | quote }}]
        searches: [{{ printf "%s.svc.cluster.local" .Release.Namespace | quote }}, svc.cluster.local, cluster.local]
        options: [{name: ndots, value: "1"}]
      containers:
        - name: traefik
          image: {{ .Values.gateway.image | quote }}
          command: [traefik]
          args: [--configFile=/etc/systems/traefik.yaml]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports:
            - {name: http, containerPort: 8080}
            - {name: https, containerPort: 8443}
            - {name: health, containerPort: 8081}
          readinessProbe:
            httpGet: {path: /ping, port: health}
          livenessProbe:
            httpGet: {path: /ping, port: health}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/systems, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: systems-config}
        - name: data
          persistentVolumeClaim: {claimName: systems-caddy-data}
        - name: tmp
          emptyDir: {}

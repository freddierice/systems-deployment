apiVersion: v1
kind: ConfigMap
metadata:
  name: systems-dns-config
data:
  Corefile: |
    .:1053 {
      errors
      health :8080
      ready :8181
      rewrite stop {
        name exact {{ .Values.privateCA.hostname }} ca-tailnet.{{ .Release.Namespace }}.svc.cluster.local
        answer auto
      }
      {{- range $name, $app := (include "systems.webApps" . | fromYaml) }}
      # cert-manager's HTTP-01 self-check stays within the cluster.
      rewrite stop {
        name exact {{ $app.hostname }} systems-gateway.{{ $.Release.Namespace }}.svc.cluster.local
        answer auto
      }
      {{- end }}
      forward . /etc/resolv.conf
      cache 30
      loop
      reload
    }

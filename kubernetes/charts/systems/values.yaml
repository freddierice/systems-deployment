postgresMigrationVerified: false
backgroundJobsEnabled: false
imagePullSecrets: []

# Keep suspended until state is copied, preflight passes, and source cron is disabled.
dailyReport:
  enabled: false
  suspend: true
  image: ""
  schedule: "30 5 * * *"
  timeZone: America/Chicago
  startingDeadlineSeconds: 900
  activeDeadlineSeconds: 2400
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  runtimeSecret: daily-report-runtime
  googleSecret: daily-report-google
  health:
    # Empty uses the Health Service in the release namespace.
    url: ""
    # The trusted internal route uses Health's canonical host and HTTPS headers.
    # Empty omits these headers, for example when url is the public HTTPS origin.
    host: health.freddie.xyz
  persistence:
    storageClassName: do-block-storage-retain
    size: 1Gi
  printer:
    # Requires a reachable subnet route in the operator's tailnet before enabling.
    enabled: false
    tailnetIP: 10.0.0.33
    tags: tag:systems
    # Empty uses the printer Service in the release namespace.
    uri: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

gateway:
  hostname: systems

privateCA:
  hostname: ca.freddie.xyz
  directory: https://ca.freddie.xyz/acme/acme/directory
  tailnetFQDN: ca-nyc1.impala-hen.ts.net

# Only cert-manager uses this resolver. DOKS-managed CoreDNS is not changed.
dns:
  image: coredns/coredns:1.14.7
  serviceIP: 10.71.0.53

apps:
  health:
    enabled: false
    hostname: health.freddie.xyz
    image: ""
    originVariable: HEALTH_HTTPS_ORIGIN
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {memory: 512Mi}
  trends:
    enabled: false
    hostname: trends.freddie.xyz
    image: ""
    originVariable: TRENDS_HTTPS_ORIGIN
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 1Gi}

postgresMigrationVerified: false
backgroundJobsEnabled: false
imagePullSecrets: []

gateway:
  hostname: systems

privateCA:
  hostname: ca.freddie.xyz
  directory: https://ca.freddie.xyz/acme/acme/directory
  tailnetFQDN: ca-nyc1.impala-hen.ts.net

# Only cert-manager uses this resolver. DOKS-managed CoreDNS is not changed.
dns:
  image: coredns/coredns:1.14.7
  serviceIP: 10.71.0.53

apps:
  health:
    enabled: false
    hostname: health.freddie.xyz
    image: ""
    originVariable: HEALTH_HTTPS_ORIGIN
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {memory: 512Mi}
  trends:
    enabled: false
    hostname: trends.freddie.xyz
    image: ""
    originVariable: TRENDS_HTTPS_ORIGIN
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 1Gi}

# Copy to kubernetes/values.local.yaml. This file is used directly by Helm.
# Keep apps disabled until their PostgreSQL schemas and data are verified.
postgresMigrationVerified: false
imagePullSecrets: []
apps:
  health:
    enabled: false
    image: ""
  trends:
    enabled: false
    image: ""


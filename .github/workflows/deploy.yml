name: Deploy application

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      image_digest:
        required: true
        type: string
      run_id:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      inputs.source_sha == github.sha &&
      ((github.repository == 'freddierice/health' && inputs.app == 'health') ||
       (github.repository == 'freddierice/trends' && inputs.app == 'trends'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: source
    env:
      KUBE_CONTEXT: do-nyc1-systems
      DOKS_CLUSTER_ID: 27e1393e-6d47-48b4-8b84-5df941e60fd4
    steps:
      - name: Check out the current deployment configuration
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: freddierice/systems-deployment
          ref: main
          fetch-depth: 0
          persist-credentials: false
          # Google's temporary federation credentials stay outside this checkout.
          path: source
      - name: Authenticate to Google Cloud through GitHub OIDC
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/186933910776/locations/global/workloadIdentityPools/systems-actions/providers/github
          service_account: systems-ci-deploy@macro-events-882dcb.iam.gserviceaccount.com
          create_credentials_file: true
          cleanup_credentials: true
          token_format: access_token
      - name: Read deployment credentials from Google Secret Manager
        id: credentials
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |
            digitalocean:projects/186933910776/secrets/systems-actions-digitalocean-deploy/versions/latest
            git_key:projects/186933910776/secrets/systems-actions-git-key/versions/latest
      - name: Configure the existing deployment-repository Git identity
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: freddierice/systems-deployment
          ref: main
          fetch-depth: 0
          path: source
          ssh-key: ${{ steps.credentials.outputs.git_key }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0
      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.36.3
      - name: Set up doctl
        uses: digitalocean/action-doctl@135ac0aa0eed4437d547c6f12c364d3006b42824 # v2.5.1
        with:
          version: "1.168.0"
          token: ${{ steps.credentials.outputs.digitalocean }}
      - name: Prepare deployment tools
        run: |
          for tool in git gh helm kubectl doctl; do
            command -v "$tool" >/dev/null
          done
          pip install -r requirements-dev.txt
      - name: Wait for exclusive access to the shared deployment
        id: lock
        timeout-minutes: 22
        env:
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          python scripts/actions-release-lock.py acquire \
            --owner "$GITHUB_REPOSITORY/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" \
            --state "$RUNNER_TEMP/systems-release-lock.json"
      - name: Allow this runner through the public API firewall
        id: firewall
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ steps.credentials.outputs.digitalocean }}
        run: python scripts/actions-cluster-access.py prepare --state "$RUNNER_TEMP/systems-firewall.json"
      - name: Obtain temporary Kubernetes credentials
        run: |
          umask 077
          export KUBECONFIG="$RUNNER_TEMP/systems-kubeconfig"
          echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"
          doctl kubernetes cluster kubeconfig save "$DOKS_CLUSTER_ID" --expiry-seconds 3300
          for attempt in $(seq 1 30); do
            if kubectl --context "$KUBE_CONTEXT" --request-timeout=5s get --raw /readyz >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo 'The public Kubernetes API did not become reachable.' >&2
          exit 1
      - name: Deploy the requested image and record the successful release
        timeout-minutes: 40
        env:
          # The caller's built-in token reads only its own private app repository.
          GH_TOKEN: ${{ github.token }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ steps.credentials.outputs.digitalocean }}
          RELEASE_APP: ${{ inputs.app }}
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_IMAGE_DIGEST: ${{ inputs.image_digest }}
          RELEASE_RUN_ID: ${{ inputs.run_id }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python scripts/deploy-app.py \
            --app "$RELEASE_APP" \
            --source-sha "$RELEASE_SOURCE_SHA" \
            --image-digest "$RELEASE_IMAGE_DIGEST" \
            --run-id "$RELEASE_RUN_ID"
      - name: Remove this runner's API firewall allowance
        id: firewall_cleanup
        if: always() && steps.firewall.outcome != 'skipped'
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ steps.credentials.outputs.digitalocean }}
        run: python scripts/actions-cluster-access.py cleanup --state "$RUNNER_TEMP/systems-firewall.json"
      - name: Preserve firewall cleanup state if removal failed
        if: always() && steps.firewall_cleanup.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firewall-cleanup-${{ github.run_id }}
          path: ${{ runner.temp }}/systems-firewall.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Remove temporary Kubernetes credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/systems-kubeconfig"
      - name: Refresh Google access for lock cleanup
        id: cleanup_auth
        if: always() && steps.lock.outcome != 'skipped' && steps.auth.outcome == 'success'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/186933910776/locations/global/workloadIdentityPools/systems-actions/providers/github
          service_account: systems-ci-deploy@macro-events-882dcb.iam.gserviceaccount.com
          create_credentials_file: false
          token_format: access_token
      - name: Release the shared deployment lock
        if: always() && steps.cleanup_auth.outcome == 'success'
        env:
          GCP_ACCESS_TOKEN: ${{ steps.cleanup_auth.outputs.access_token }}
        run: python scripts/actions-release-lock.py release --state "$RUNNER_TEMP/systems-release-lock.json"

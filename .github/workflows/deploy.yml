name: Deploy application
run-name: Deploy ${{ github.event.client_payload.app }} from ${{ github.event.client_payload.source_sha }}

on:
  repository_dispatch:
    types: [deploy-app]

permissions:
  contents: read

# Preserve pending releases for both apps while updating the shared Helm release.
concurrency:
  group: systems-production
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'freddierice/systems-deployment' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: source
    env:
      KUBE_CONTEXT: do-nyc1-systems
      DOKS_CLUSTER_ID: 27e1393e-6d47-48b4-8b84-5df941e60fd4
    steps:
      - name: Check out the current deployment configuration
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          # Google's temporary federation credentials stay outside this checkout.
          path: source
      - name: Authenticate to Google Cloud through GitHub OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          cleanup_credentials: true
      - name: Read deployment credentials from Google Secret Manager
        id: credentials
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |
            digitalocean:projects/186933910776/secrets/systems-actions-digitalocean-deploy/versions/latest
            github_dispatch:projects/186933910776/secrets/systems-actions-github-dispatch/versions/latest
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0
      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.36.3
      - name: Set up doctl
        uses: digitalocean/action-doctl@135ac0aa0eed4437d547c6f12c364d3006b42824 # v2.5.1
        with:
          version: "1.168.0"
          token: ${{ steps.credentials.outputs.digitalocean }}
      - name: Prepare deployment tools
        run: |
          for tool in git gh helm kubectl doctl; do
            command -v "$tool" >/dev/null
          done
          pip install -r requirements-dev.txt
      - name: Allow this runner through the public API firewall
        id: firewall
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ steps.credentials.outputs.digitalocean }}
        run: python scripts/actions-cluster-access.py prepare --state "$RUNNER_TEMP/systems-firewall.json"
      - name: Obtain temporary Kubernetes credentials
        run: |
          umask 077
          export KUBECONFIG="$RUNNER_TEMP/systems-kubeconfig"
          echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"
          doctl kubernetes cluster kubeconfig save "$DOKS_CLUSTER_ID" --expiry-seconds 3300
          for attempt in $(seq 1 30); do
            if kubectl --context "$KUBE_CONTEXT" --request-timeout=5s get --raw /readyz >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo 'The public Kubernetes API did not become reachable.' >&2
          exit 1
      - name: Deploy the requested image and record the successful release
        timeout-minutes: 40
        env:
          GH_TOKEN: ${{ steps.credentials.outputs.github_dispatch }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ steps.credentials.outputs.digitalocean }}
          RELEASE_APP: ${{ github.event.client_payload.app }}
          RELEASE_SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          RELEASE_IMAGE_DIGEST: ${{ github.event.client_payload.image_digest }}
          RELEASE_RUN_ID: ${{ github.event.client_payload.run_id }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python scripts/deploy-app.py \
            --app "$RELEASE_APP" \
            --source-sha "$RELEASE_SOURCE_SHA" \
            --image-digest "$RELEASE_IMAGE_DIGEST" \
            --run-id "$RELEASE_RUN_ID"
      - name: Remove this runner's API firewall allowance
        id: firewall_cleanup
        if: always() && steps.firewall.outcome != 'skipped'
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ steps.credentials.outputs.digitalocean }}
        run: python scripts/actions-cluster-access.py cleanup --state "$RUNNER_TEMP/systems-firewall.json"
      - name: Preserve firewall cleanup state if removal failed
        if: always() && steps.firewall_cleanup.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firewall-cleanup-${{ github.run_id }}
          path: ${{ runner.temp }}/systems-firewall.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Remove temporary Kubernetes credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/systems-kubeconfig"
